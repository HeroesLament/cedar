[package]
name = "wx-mvu-shader-image"
version = "0.1.0"
edition = "2021"
publish = false

# `lib` so the crate also builds for the host (enabling `cargo test` of the
# pure math functions and rust-analyzer support); `dylib` for the SPIR-V build.
[lib]
crate-type = ["lib", "dylib"]

[dependencies]
# Shader maths, with no spirv-std dependency so it tests on stable.
wx-mvu-shader-core = { path = "../core" }

# Pinned to an exact revision, not a branch. rust-gpu publishes alphas years
# apart and tells you to build from `main`, so a floating git dependency would
# silently move the compiler out from under committed artifacts. Bumping this
# is a deliberate step - see shaders/shaders.exs.
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "7cb31ae4f9fb069f6c539fdcdfd68b8b6e77e85f" }
